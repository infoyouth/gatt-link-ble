name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
    name: Create semantic release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Confirm CI checked the current main commit
        id: current-main
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" == "$CI_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "CI result is stale; main has advanced"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.current-main.outputs.current == 'true'
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: steps.current-main.outputs.current == 'true'
        with:
          enable-cache: true

      - name: Install uv.lock
        if: steps.current-main.outputs.current == 'true'
        run: uv sync --locked --all-groups

      - name: Release with Python Semantic Release
        if: steps.current-main.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: uv run --with python-semantic-release==10.7.0 --no-project semantic-release version
