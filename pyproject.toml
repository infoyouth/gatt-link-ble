[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gatt-link-ble"
version = "0.1.0"
description = "Async BLE GATT discovery, parsing, and state updates."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "infoyouth" }]
dependencies = [
    "bleak>=0.22.0",
    "bleak-retry-connector>=3.6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gatt_link_ble"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
mypy_path = "src"
packages = ["gatt_link_ble"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=gatt_link_ble",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v{version}"
commit_message = "chore(release): {version}"
build_command = "uv lock --no-upgrade && uv build"
allow_zero_version = true

[tool.semantic_release.commit_parser_options]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.branches.main]
match = "^main$"

[tool.semantic_release.changelog]
default_templates = { changelog_file = "CHANGELOG.md" }
